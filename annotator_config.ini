; PoseAnnotator configuration.
; Edit this file to adapt the app behavior without changing Python code.
; For a full reference, see docs/dev/config.md.

[paths]
; Base directory used when you pass a shorthand sequence name such as `BOTTOM`.
; Relative paths are resolved relative to this config file.
sequence_root = data

[display]
; Show the pose example image next to the active crop.
show_example = true

; Use `single` for one crop view or `double` to show two scales side by side.
crop_mode = single

; Enable the infinite-space background around the bbox.
; This cannot be combined with crop_mode = double.
infinite_space_enabled = false

; Strength of the infinite-space padding.
infinite_space_strength = 0.5

; Default crop padding when the pose annotator opens.
default_bbox_padding = 0.0

[interaction]
; Relative click radius for selecting a keypoint or bbox corner.
click_radius_ratio = 0.05

; Redraw rate while dragging points.
drag_redraw_fps = 20

; Number of undo states kept for the current annotation.
history_size = 100

; Number of visibility states cycled by the `v` key.
visibility_levels = 3

[annotation]
; Supported formats: `coco`, `coco_with_thumbs`
pose_format = coco

[workflow]
; Number of annotations skipped by `.` and `,`.
jump_step = 10

; Seconds before an opened annotation is marked as checked.
mark_checked_interval_seconds = 3.0

[saving]
; Suffix appended to pose-annotation output files.
output_suffix = _manual
